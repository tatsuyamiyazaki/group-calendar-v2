          <div className="flex-shrink-0 p-3 border-r flex items-center bg-white sticky left-0 z-40 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] cursor-pointer hover:bg-gray-100 transition-colors group" style={{width:sidebarWidth,minWidth:sidebarWidth}} onClick={()=>onResourceClick&&onResourceClick(resource.id)}>
            <div className={`flex overflow-hidden w-full ${isCompact?'flex-col justify-center items-center py-1 px-0.5 gap-0':'flex-row items-center px-2 gap-2'}`}>
              {resource.photoUrl?<img src={resource.photoUrl} alt="" className="w-8 h-8 rounded-full flex-shrink-0 object-cover group-hover:opacity-80 transition-opacity"/>:
              <div className="w-8 h-8 rounded-full text-white flex items-center justify-center text-xs font-bold select-none flex-shrink-0 group-hover:opacity-80 transition-opacity" style={{backgroundColor:adjustColorHsl(resource.color||'#4285F4')}}>{resource.name?resource.name.slice(0,2).toUpperCase():'?'}</div>}
              <div className={`overflow-hidden min-w-0 ${isCompact?'w-full text-center mt-1':'flex-1 text-left'}`}>
                <div className={`text-sm font-medium text-gray-800 select-none leading-tight group-hover:text-blue-600 transition-colors ${textOvf}`} title={resource.email||resource.id}>{resource.name}</div>
                <div className={`text-[10px] text-gray-500 select-none leading-tight ${textOvf}`}>{resource.email||resource.id}</div>
              </div>
            </div>
          </div>
          <div className={`flex-1 relative w-full ${!isMe(resource.id)?'bg-gray-50/30':''}`}>
            <div className="flex relative h-full w-full">
            {(()=>{
              const dStart=new Date(currentDate);dStart.setHours(0,0,0,0);
              const dEnd=new Date(currentDate);dEnd.setHours(23,59,59,999);
              return <>
                {hasAllDayEvents&&<div className="w-16 flex-shrink-0 border-r bg-gray-50 p-1 space-y-1 overflow-y-auto flex-none">
                  {(resource.events||[]).filter(e=>e.isAllDay&&new Date(e.start)<dEnd&&new Date(e.end)>dStart).map(evt=>{
                    const{style,cls}=getEvtStyle(evt,resource.id,resource.color);
                    return <div key={evt.id} onClick={e=>{e.stopPropagation();onEventClick(evt)}} onMouseEnter={e=>{setHoverEvent(evt);setTtPos({x:e.clientX,y:e.clientY})}} onMouseLeave={()=>setHoverEvent(null)} className={`p-1 rounded text-[10px] shadow-sm cursor-pointer hover:opacity-90 truncate ${cls}`} style={style} title={evt.title||'終日予定'}>{evt.title||'終日予定'}</div>
                  })}
                </div>}
                <div className="flex-1 flex relative">
                  {hours.map(h=><div key={h} className={`flex-1 min-w-0 border-r h-full last:border-r-0 grid-cell ${isMe(resource.id)?'cursor-pointer':'cursor-default'} relative`} onClick={e=>{
                    const rect=e.currentTarget.getBoundingClientRect();const x=e.clientX-rect.left;const half=x>(rect.width/2);
                    const ct=new Date(currentDate);ct.setHours(h,half?30:0,0,0);onCellClick(resource.id,ct.toISOString());
                  }}><div className="absolute h-full border-l border-gray-100 left-1/2 pointer-events-none"></div></div>)}
                  {showRedLine&&<div className="absolute top-0 bottom-0 z-30 border-r-2 border-red-500 transform -translate-x-1/2 pointer-events-none" style={{left:`${redLineLeft}%`}}></div>}
                  <div className="absolute inset-0 pointer-events-none z-10">
                    {(()=>{
                      const sorted=(resource.events||[]).filter(e=>{
                        if(e.isAllDay)return false;const eS=new Date(e.start),eE=new Date(e.end);return eS<dEnd&&eE>dStart;
                      }).sort((a,b)=>{const d=new Date(a.start)-new Date(b.start);return d!==0?d:new Date(b.end)-new Date(a.end)});
                      const lanes=[];
                      return sorted.map(evt=>{
                        const s=new Date(evt.start),e=new Date(evt.end);const bd=new Date(currentDate);bd.setHours(0,0,0,0);
                        let sH=(s-bd)/3600000,eH=(e-bd)/3600000;
                        if(eH<=startHour||sH>=(endHour+1))return null;
                        if((eH-sH)<0.5){sH=Math.floor(sH*2)/2;eH=sH+0.5}
                        if(sH<startHour)sH=startHour;if(eH>(endHour+1))eH=endHour+1;
                        let dur=eH-sH;if(dur<0.1)dur=0.1;
                        const left=((sH-startHour)/totalHours)*100,width=(dur/totalHours)*100;
                        let li=-1;for(let l=0;l<lanes.length;l++){if(lanes[l]<=new Date(evt.start)){li=l;break}}
                        if(li===-1){li=lanes.length;lanes.push(new Date(evt.end))}else{lanes[li]=new Date(evt.end)}
                        const bs=24,cs=5,th=3;let it;
                        if(li<=th){it=2+(li*bs)}else{it=2+(th*bs)+((li-th)*cs)}
                        if(it>96){const ov=Math.min((li-th),10);it=96+(ov*1);if(it>108)it=108}
                        const{style,cls}=getEvtStyle(evt,resource.id,resource.color);const isW=width>20;
                        return <div key={evt.id} onClick={e=>{e.stopPropagation();setHoverEvent(null);onEventClick(evt)}} onMouseEnter={e=>{setHoverEvent(evt);setTtPos({x:e.clientX,y:e.clientY})}} onMouseLeave={()=>setHoverEvent(null)} className={`absolute rounded text-xs p-1 overflow-hidden shadow-sm cursor-pointer border border-white/40 pointer-events-auto flex ${isW?'flex-row items-start gap-1':'flex-col justify-start'} ${cls}`} style={{left:`${left}%`,width:`${width}%`,top:`${it}px`,bottom:'2px',minWidth:'4px',zIndex:10+li,...style}}>
                          <div className="text-[13px] font-normal leading-tight break-words whitespace-normal truncate flex-shrink-0 max-w-full">{evt.title||'予定あり'}</div>
                          <div className={`text-[10px] opacity-90 overflow-hidden whitespace-nowrap min-w-0 ${isW?'mt-[1px]':'mt-0.5'}`}>{getTimeLabel(evt)}</div>
                        </div>
                      });
                    })()}
                  </div>
                </div>
              </>
            })()}
            </div>
          </div>
        </div>})}
        <div className="h-32 w-full"></div>

/* === SchedulerGrid === */
const SchedulerGrid=({viewMode,currentDate,resources,onEventClick,onCellClick,myEmail,sharedScrollTop,isVisible,isLoading,sidebarWidth,onSidebarResize,groupId,settings,onResourceClick})=>{
  const sRef=useRef(null);const tRef=useRef(null);const hRef=useRef(null);const tbRef=useRef(null);
  const[hoverEvent,setHoverEvent]=useState(null);const[ttPos,setTtPos]=useState(null);
  const[selectedDayEvents,setSelectedDayEvents]=useState(null);
  const useMono=settings?.useMonoColor;

  const timeRange=useMemo(()=>{
    let min=8,max=19;
    if(isVisible){resources.forEach(r=>(r.events||[]).forEach(e=>{
      if(!e.isAllDay){
        const dS=new Date(e.start);if(dS.toDateString()===currentDate.toDateString()){const h=dS.getHours();if(h<min)min=h}
        const dE=new Date(e.end);if(dE.toDateString()===currentDate.toDateString()){const h=dE.getHours()+(dE.getMinutes()>0?1:0);if(h>max)max=Math.min(24,h)}
      }
    }))}
    return{start:min,end:max}
  },[currentDate,resources,isVisible]);

  const hasAllDayEvents=useMemo(()=>{
    if(viewMode!=='day')return false;
    return resources.some(r=>(r.events||[]).some(e=>e.isAllDay&&new Date(e.start).toDateString()===currentDate.toDateString()));
  },[resources,currentDate,viewMode]);

  useEffect(()=>{
    const handleScroll=(e)=>{
      if(!isVisible)return;const t=e.target;
      if(t===tbRef.current){if(hRef.current)hRef.current.scrollLeft=t.scrollLeft;if(sRef.current)sRef.current.scrollTop=t.scrollTop;if(sharedScrollTop)sharedScrollTop(t.scrollTop)}
      else if(t===sRef.current){if(tbRef.current)tbRef.current.scrollTop=t.scrollTop}
    };
    const tb=tbRef.current,sb=sRef.current;
    if(tb)tb.addEventListener('scroll',handleScroll,{passive:true});if(sb)sb.addEventListener('scroll',handleScroll,{passive:true});
    return()=>{if(tb)tb.removeEventListener('scroll',handleScroll);if(sb)sb.removeEventListener('scroll',handleScroll)}
  },[isVisible,sharedScrollTop,viewMode]);

  if(!isVisible)return null;

  // ミーティングビューモード
  const isMeetingView = settings?.groups?.find(g=>g.id===groupId)?.meetingView;
  if(isMeetingView && (viewMode==='day'||viewMode==='week'||viewMode==='month')){
    return <MeetingView currentDate={currentDate} resources={resources} onEventClick={onEventClick} myEmail={myEmail} viewMode={viewMode} isLoading={isLoading}/>;
  }

  if(viewMode==='month')return <MonthView currentDate={currentDate} resources={resources} onEventClick={onEventClick} myEmail={myEmail} groupId={groupId}/>;
  const isCompactDayView = settings?.groups?.find(g=>g.id===groupId)?.isCompactDayView || false;
  const effectiveSidebarWidth = window.innerWidth < 768 ? 60 : sidebarWidth;
  if(viewMode==='day'&&!isCompactDayView)return <V1ClassicDayView currentDate={currentDate} resources={resources} onEventClick={onEventClick} onCellClick={onCellClick} myEmail={myEmail} isLoading={isLoading} sidebarWidth={effectiveSidebarWidth} onSidebarResize={onSidebarResize} settings={settings} timeRange={timeRange} onResourceClick={onResourceClick}/>;

  if(viewMode==='week'){
    const startDay = settings?.weekStartDay || 0;
    const dates=Array.from({length:7},(_,i)=>{
      const d=new Date(currentDate);
      const currentDay = d.getDay();
      const diff = currentDay < startDay ? 7 - startDay + currentDay : currentDay - startDay;
      d.setDate(d.getDate() - diff + i);
      return d;
    });
    return <div className="flex-1 flex flex-col h-full bg-white overflow-hidden relative">
      {isLoading&&<div className="absolute inset-0 bg-white/50 z-50 flex items-center justify-center"><div className="animate-spin h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full"></div></div>}
      <div className="flex-1 flex flex-col overflow-auto custom-scrollbar relative">
        {/* ヘッダー行 */}
        <div className="flex border-b bg-gray-50 sticky top-0 z-[60] w-full">
          <div className="flex-shrink-0 border-r bg-white sticky left-0 z-[60] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] relative" style={{width:sidebarWidth,minWidth:sidebarWidth}}>
            <div className="resizer-handle" onMouseDown={e=>{e.preventDefault();const move=ev=>{const w=ev.clientX;if(w>60&&w<500&&onSidebarResize)onSidebarResize(w)};const up=()=>{window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up)};window.addEventListener('mousemove',move);window.addEventListener('mouseup',up)}}><div className="resizer-bar"></div></div>
          </div>
          <div className="flex-1 min-w-0 flex">
            {dates.map((d,i)=>{
              const isToday=d.toDateString()===new Date().toDateString();const isPast=d<new Date(new Date().setHours(0,0,0,0));
              return <div key={i} className={`flex-1 min-w-0 border-r text-center py-2 ${isToday?'bg-blue-50':''} ${isPast?'past-header':''}`}>
                <div className={`text-xs font-bold ${isToday?'text-blue-600':isPast?'text-gray-400':'text-gray-700'}`}>{d.getDate()} ({['日','月','火','水','木','金','土'][d.getDay()]})</div>
              </div>
            })}
          </div>
        </div>
        {/* リソース行 */}
        <div className="w-full relative flex flex-col">
          {resources.map((r,rIdx)=>{
            const isSep = r.id.startsWith('_SEP_');
            if (isSep) {
               const label = r.id.split(':').slice(2).join(':') || '';
               return <div key={r.id} className="flex min-h-[32px] relative bg-gray-100 border-b shadow-inner">
                 <div className="flex-shrink-0 flex items-center px-3 sticky left-0 z-40 bg-gray-100 border-r shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]" style={{width:sidebarWidth,minWidth:sidebarWidth}}>
                   <span className="text-[11px] font-bold text-gray-500 truncate">{label}</span>
                 </div>
               </div>
            }

            return <div key={r.id} className={`flex border-b min-h-[120px] transition-colors hover:bg-gray-50 ${rIdx%2!==0?'bg-gray-50/30':'bg-white'}`}>
              <div className="flex-shrink-0 p-2 border-r flex flex-col items-center justify-center truncate sticky left-0 z-40 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] cursor-pointer hover:bg-gray-100 transition-colors group bg-inherit" style={{width:sidebarWidth,minWidth:sidebarWidth}} onClick={()=>onResourceClick&&onResourceClick(r.id)}>
                {r.photoUrl?<img src={r.photoUrl} className="w-8 h-8 rounded-full mb-1 object-cover group-hover:opacity-80 transition-opacity"/>:<div className="w-8 h-8 rounded-full text-white flex items-center justify-center text-xs font-bold mb-1 group-hover:opacity-80 transition-opacity" style={{backgroundColor:useMono&&r.id!==myEmail?adjustColorHsl(r.color):r.color||'#4285F4'}}>{r.name?r.name.slice(0,2).toUpperCase():'?'}</div>}
                <div className="font-bold text-[11px] text-gray-800 truncate w-full text-center" title={r.name}>{r.name}</div>
                <div className="text-[9px] text-gray-400 truncate w-full text-center">{r.id}</div>
              </div>
              <div className="flex-1 flex min-w-0 bg-transparent">
                {dates.map((d,cIdx)=>{
                  const dStart=new Date(d); dStart.setHours(0,0,0,0);
                  const dEnd=new Date(d); dEnd.setHours(23,59,59,999);
                  const dayEvents=(r.events||[]).filter(e=>{
                     const s=new Date(e.start), ed=new Date(e.end);
                     if(e.isAllDay)return d.toDateString()===s.toDateString();
                     return s<dEnd&&ed>dStart;
                  }).sort((a,b)=>new Date(a.start)-new Date(b.start));

                  return <div key={cIdx} className="flex-1 min-w-0 border-r p-1 flex flex-col space-y-1 hover:bg-black/5 cursor-pointer" onClick={()=>onCellClick(r.id,new Date(d.getFullYear(),d.getMonth(),d.getDate(),9).toISOString())}>
                    {dayEvents.map((evt,eIdx)=>{
                       const st=new Date(evt.start);
                       const timeStr=evt.isAllDay?'':`${st.getHours()}:${String(st.getMinutes()).padStart(2,'0')}`;
                       const isFacility = evt.resourceEmail && (evt.resourceEmail.includes('resource.calendar.google.com') || evt.resourceEmail.includes('group.calendar.google.com'));
                       return <div key={evt.id+'_'+eIdx} onClick={(e)=>{e.stopPropagation();onEventClick(evt)}} className="text-[10px] p-1 rounded cursor-pointer hover:opacity-80 text-white shadow-sm flex items-center gap-1 border border-black/10 overflow-hidden flex-shrink-0 event-solid-tile" style={{backgroundColor:useMono&&r.id!==myEmail?adjustColorHsl(r.color):evt.color||r.color||'#4285F4'}} title={evt.title}>
                         {timeStr&&<div className="opacity-90 font-bold flex-shrink-0">{timeStr}</div>}
                         <div className="font-bold truncate leading-tight flex-1">{evt.title||'予定あり'}</div>
                         {evt.resourcePhotoUrl ? <img src={evt.resourcePhotoUrl} className="w-3 h-3 rounded-full ml-1 flex-shrink-0 object-cover"/> : 
                         (evt.resourceName && <div className="w-3 h-3 rounded-full bg-white/30 flex items-center justify-center text-[7px] font-bold ml-1 flex-shrink-0">
                           {isFacility ? <Icon name="building" size={6}/> : evt.resourceName.slice(0,1)}
                         </div>)}
                       </div>
                    })}
                  </div>
                })}
              </div>
            </div>
          })}
        </div>
      </div>
      <HoverTooltip event={hoverEvent} position={ttPos}/>
    </div>
  }

  const dates=[currentDate];
  const hours=Array.from({length:timeRange.end-timeRange.start},(_,i)=>i+timeRange.start);
  const totalCols=dates.length;const defaultRowHeight=40;

  const rowOffsets = [];
  let currentY = 0;
  resources.forEach(r => {
    rowOffsets.push(currentY);
    currentY += r.id.startsWith('_SEP_') ? 24 : defaultRowHeight;
  });
  const totalHeight = currentY;

  return <div className="flex-1 flex flex-col h-full bg-white overflow-hidden relative">
    {isLoading&&<div className="absolute inset-0 bg-white/50 z-50 flex items-center justify-center"><div className="animate-spin h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full"></div></div>}
    
    <div className="flex-1 flex flex-col overflow-auto custom-scrollbar relative" ref={tbRef}>
      {/* ヘッダー行 */}
      <div className="flex flex-shrink-0 border-b bg-gray-50 sticky top-0 z-[60] min-w-max w-full">
        <div className="flex-shrink-0 border-r bg-gray-100 sticky left-0 z-[60] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] relative" style={{width:sidebarWidth,minWidth:sidebarWidth}}>
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
            <div className="flex items-end gap-1">
              <span className="text-2xl font-bold text-gray-500 leading-none">{currentDate.getDate()}</span>
              <span className="text-xs font-bold text-gray-400 mb-0.5">{currentDate.toLocaleDateString('ja-JP',{weekday:'short'}).replace(/[()（）]/g,'')}</span>
            </div>
          </div>
          <div className="resizer-handle" onMouseDown={e=>{e.preventDefault();const move=ev=>{const w=ev.clientX;if(w>60&&w<500&&onSidebarResize)onSidebarResize(w)};const up=()=>{window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up)};window.addEventListener('mousemove',move);window.addEventListener('mouseup',up)}}><div className="resizer-bar"></div></div>
        </div>
        <div className="flex-1 min-w-[600px] flex relative">
          {hasAllDayEvents&&<div className="w-16 flex-shrink-0 border-r bg-gray-100 flex-none flex items-center justify-center md:sticky md:z-[50] md:shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]" style={{left:sidebarWidth}}><span className="text-[10px] text-gray-500 font-bold">終日</span></div>}
          <div className="flex-1 flex relative">
            {hours.map(h=><div key={h} className="flex-1 min-w-0 border-r py-2 text-center text-sm text-gray-500 relative overflow-hidden">{h}<span className="hidden md:inline">:00</span></div>)}
          </div>
        </div>
      </div>

      {/* 本体行 */}
      <div className="flex flex-shrink-0 min-w-max relative w-full" style={{height:totalHeight}}>
        {/* 左サイドバー (Sticky left-0) */}
        <div style={{width:sidebarWidth}} className="border-r bg-gray-50 sticky left-0 z-40 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] h-full">
          <div className="relative w-full h-full">
            {resources.map((r,rIdx)=>{
              const isSep = r.id.startsWith('_SEP_');
              const h = isSep ? 24 : defaultRowHeight;
              const y = rowOffsets[rIdx];
              if (isSep) {
                 const label = r.id.split(':').slice(2).join(':') || '';
                 return <div key={r.id} className="absolute w-full flex items-center px-2 border-b bg-gray-100 shadow-inner" style={{top:y,height:h}}>
                   <span className="text-[11px] font-bold text-gray-500 truncate">{label}</span>
                 </div>;
              }
              return <div key={r.id} className={`absolute w-full border-b px-2 flex flex-col justify-center truncate group cursor-pointer hover:bg-gray-100 transition-colors ${rIdx%2!==0?'bg-gray-50/30':'bg-white'}`} style={{top:y,height:h}} onClick={()=>onResourceClick&&onResourceClick(r.id)} title={`${r.name}\n${r.id}`}>
                <div className="flex items-center gap-1.5 truncate">
                  {r.photoUrl?<img src={r.photoUrl} className="w-5 h-5 rounded-full object-cover flex-shrink-0"/>:<div className="w-5 h-5 rounded-full text-white flex items-center justify-center text-[10px] font-bold flex-shrink-0" style={{backgroundColor:useMono&&r.id!==myEmail?adjustColorHsl(r.color):r.color||'#4285F4'}}>{r.name?r.name.slice(0,1).toUpperCase():'?'}</div>}
                  <div className="font-bold text-[11px] text-gray-800 truncate">{r.name}</div>
                </div>
              </div>
            })}
          </div>
        </div>

        {/* グリッド本体 */}
        <div className="flex-1 min-w-[600px] flex relative bg-white">
          {/* 終日予定カラム (PC: Sticky) */}
          {hasAllDayEvents && <div className="w-16 flex-shrink-0 border-r bg-gray-50 md:sticky md:z-30 md:shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] h-full" style={{left:sidebarWidth}}>
            <div className="relative w-full h-full">
              {resources.map((r,rIdx)=>{
                  const isSep = r.id.startsWith('_SEP_');
                  const h = isSep ? 24 : defaultRowHeight;
                  const y = rowOffsets[rIdx];
                  if (isSep) return <div key={r.id} className="absolute w-full border-b bg-gray-100" style={{top:y,height:h}}></div>;
                  const allDayEvents = (r.events||[]).filter(e=>e.isAllDay && new Date(e.start).toDateString()===dates[0].toDateString());
                  return <div key={r.id} className="absolute w-full border-b flex flex-col p-1 gap-1 overflow-hidden" style={{top:y,height:h}}>
                      {allDayEvents.slice(0,2).map((evt,eIdx)=><div key={evt.id} className="w-full rounded text-[9px] px-1 truncate cursor-pointer shadow-sm border border-black/10 flex-shrink-0 hover:opacity-90" style={{backgroundColor:useMono&&r.id!==myEmail?adjustColorHsl(r.color):evt.color||r.color||'#4285F4',color:'#fff'}} title={evt.title} onClick={()=>onEventClick(evt)} onMouseEnter={ev=>{setHoverEvent(evt);setTtPos({x:ev.clientX,y:ev.clientY})}} onMouseLeave={()=>setHoverEvent(null)}>{evt.title||'終日予定'}</div>)}
                      {allDayEvents.length > 2 && (
                         <div onClick={(ev)=>{ev.stopPropagation();setSelectedDayEvents(allDayEvents)}} className="text-[9px] text-gray-500 font-bold hover:bg-gray-200 cursor-pointer rounded text-center mt-auto flex-shrink-0 truncate w-full">
                           +他{allDayEvents.length - 2}件
                         </div>
                      )}
                  </div>
              })}
            </div>
          </div>}

          <div className="flex-1 relative">
            {/* 背景グリッドと時間線 */}
            <div className="absolute inset-0 pointer-events-none z-0 flex">
              {dates.map((_,i)=><div key={i} className="flex-1 min-w-0 border-r relative">
                {hours.map((h,j)=><div key={j} className="absolute border-l border-gray-100 h-full" style={{left:`${(j/hours.length)*100}%`}}></div>)}
              </div>)}
            </div>
            {/* 横線 (区切り線等) - w-fullだと途切れるためleft-0 right-0 */}
            <div className="absolute inset-0 pointer-events-none z-0">
              {resources.map((r,i)=>{
                 const nextY = rowOffsets[i] + (r.id.startsWith('_SEP_') ? 24 : defaultRowHeight);
                 return <div key={i} className="absolute left-0 right-0 border-b border-gray-100" style={{top:nextY}}></div>;
              })}
            </div>
            
            {/* セルクリック領域 */}
            {resources.map((r,rIdx)=>{
              const isSep = r.id.startsWith('_SEP_');
              const y = rowOffsets[rIdx];
              const h = isSep ? 24 : defaultRowHeight;
              return <div key={r.id} className={`absolute left-0 right-0 flex ${isSep?'pointer-events-none bg-gray-100 border-b shadow-inner':(rIdx%2!==0?'bg-gray-50/30':'bg-transparent')}`} style={{top:y,height:h,zIndex:5}}>
                {isSep ? null :
                dates.map((d,cIdx)=><div key={cIdx} className="flex-1 min-w-0 relative flex">
                  {hours.map((h,hIdx)=><div key={hIdx} className="flex-1 h-full cursor-crosshair grid-cell" onClick={()=>onCellClick(r.id,new Date(d.getFullYear(),d.getMonth(),d.getDate(),h).toISOString())}></div>)}
                </div>)}
              </div>
            })}
            {/* イベント描画 */}
            {resources.map((r,rIdx)=>{
              const dayStr = dates[0].toDateString();
              const timeEvents = (r.events||[]).filter(e=>!e.isAllDay && new Date(e.start).toDateString()===dayStr)
                .sort((a,b)=>new Date(a.start)-new Date(b.start));
              
              let maxEnd = 0;

              return <React.Fragment key={r.id}>
                {timeEvents.map((evt,eIdx)=>{
                  const s=new Date(evt.start),e=new Date(evt.end);
                  const sMin=(s.getHours()-timeRange.start)*60+s.getMinutes();const eMin=(e.getHours()-timeRange.start)*60+e.getMinutes();
                  if(eMin<=0||sMin>=(hours.length*60))return null;
                  const ds=Math.max(0,sMin),de=Math.min(hours.length*60,eMin);
                  const left=(ds/(hours.length*60))*100,width=((de-ds)/(hours.length*60))*100;

                  const startMs = s.getTime();
                  const endMs = e.getTime();
                  const isOverlap = startMs < maxEnd;
                  if (endMs > maxEnd) maxEnd = endMs;

                  const topOffset = isOverlap ? 20 : 2;
                  const h = isOverlap ? 18 : (defaultRowHeight-4);
                  const timeStr = `${s.getHours()}:${String(s.getMinutes()).padStart(2,'0')} - ${e.getHours()}:${String(e.getMinutes()).padStart(2,'0')}`;

                  return <div key={evt.id+'_'+eIdx} className={`absolute rounded-sm px-1 overflow-hidden cursor-pointer hover:opacity-90 shadow-sm border-[1.5px] border-white/90 flex event-solid-tile ${isOverlap ? 'flex-row items-center gap-1' : 'flex-col justify-start pt-0.5'}`} style={{top:rowOffsets[rIdx]+topOffset,height:h,left:`calc(${left/totalCols}%)`,width:`calc(${width/totalCols}% - 2px)`,backgroundColor:useMono&&r.id!==myEmail?adjustColorHsl(r.color):evt.color||r.color||'#4285F4',color:'#fff',zIndex:isOverlap?21:20}} onClick={()=>onEventClick(evt)} onMouseEnter={ev=>{setHoverEvent(evt);setTtPos({x:ev.clientX,y:ev.clientY})}} onMouseLeave={()=>setHoverEvent(null)}>
                    <div className={`truncate ${isOverlap?'text-[9px] font-medium flex-shrink-0 max-w-full':'text-[10px] font-bold leading-none w-full'}`}>{evt.title||'予定あり'}</div>
                    <div className={`truncate opacity-90 ${isOverlap?'text-[8px] min-w-0':'text-[8px] leading-none mt-[2px] w-full'}`}>{timeStr}</div>
                  </div>
                })}
              </React.Fragment>
            })}
          </div>
        </div>
      </div>
    </div>
    <HoverTooltip event={hoverEvent} position={ttPos}/>
    <DayDetailsModal isOpen={!!selectedDayEvents} date={currentDate} events={selectedDayEvents || []} onClose={()=>setSelectedDayEvents(null)} onEventClick={onEventClick} myEmail={myEmail}/>
  </div>
};

/* === PersonalPanel === */
const PersonalPanel=({isOpen,onClose,myEmail,resourcesMap,onEventClick})=>{
  const[panelDate,setPanelDate]=useState(new Date());
  
  useEffect(()=>{
    if(isOpen) setPanelDate(new Date());
  },[isOpen]);

  if(!isOpen)return null;
  const me=resourcesMap[myEmail]||{events:[]};
  const today = panelDate;
  const todayEvents=(me.events||[]).filter(e=>{
    const s=new Date(e.start),ed=new Date(e.end);
    if(e.isAllDay)return today.toDateString()===s.toDateString();
    s.setHours(0,0,0,0);ed.setHours(23,59,59,999);
    return today>=s&&today<=ed;
  }).sort((a,b)=>new Date(a.start)-new Date(b.start));

  const changeDate=(days)=>{
    const d=new Date(panelDate);
    d.setDate(d.getDate()+days);
    setPanelDate(d);
  };
  const isActuallyToday = panelDate.toDateString() === new Date().toDateString();

  return <>
    <div className="md:hidden fixed inset-0 bg-black/50 z-[2000]" onClick={onClose}></div>
    <div className="w-[90%] max-w-sm max-h-[80vh] rounded-lg fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[2010] md:static md:translate-x-0 md:translate-y-0 md:w-80 md:max-h-none md:rounded-none md:z-auto bg-white flex flex-col md:border-l flex-shrink-0 shadow-xl md:shadow-[-2px_0_8px_rgba(0,0,0,0.06)] overflow-hidden">
    <div className="p-3 border-b bg-gray-50 flex justify-between items-center">
      <h3 className="font-bold flex items-center gap-1.5 text-gray-800 text-sm">
        <Icon name="user" size={16}/>
        {isActuallyToday ? `本日の予定 (${today.getDate()}日)` : `${today.getMonth()+1}月${today.getDate()}日の予定`}
      </h3>
      <div className="flex items-center">
        <button onClick={()=>changeDate(-1)} className="p-1 hover:bg-gray-200 rounded" title="前日"><Icon name="chevron-left" size={14}/></button>
        <button onClick={()=>setPanelDate(new Date())} className="px-1.5 py-0.5 text-[10px] font-bold hover:bg-gray-200 rounded text-gray-600">今日</button>
        <button onClick={()=>changeDate(1)} className="p-1 hover:bg-gray-200 rounded" title="翌日"><Icon name="chevron-right" size={14}/></button>
        <div className="w-px h-4 bg-gray-300 mx-1"></div>
        <button onClick={onClose} className="p-1.5 hover:bg-gray-200 rounded-full text-gray-500" title="閉じる"><Icon name="x" size={14}/></button>
      </div>
    </div>
    <div className="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-3">
      {todayEvents.length===0?<p className="text-gray-500 text-sm text-center mt-4">予定はありません</p>:
        todayEvents.map((e,i)=>{
          const st=new Date(e.start),ed=new Date(e.end);
          const timeStr=e.isAllDay?'終日':`${st.getHours()}:${String(st.getMinutes()).padStart(2,'0')} - ${ed.getHours()}:${String(ed.getMinutes()).padStart(2,'0')}`;
          const c = typeof adjustColorHsl === 'function' ? adjustColorHsl(e.color) : (e.color||'#4285F4');
          return <div key={i} onClick={()=>onEventClick(e)} className="p-3 border rounded-lg cursor-pointer hover:shadow-md transition-shadow border-l-4" style={{borderLeftColor:c, backgroundColor: c + '1A'}}>
            <div className="text-xs text-gray-600 font-bold mb-1 flex items-center gap-1.5">
              <div className="w-2 h-2 rounded-full" style={{backgroundColor:c}}></div>
              {timeStr}
            </div>
            <div className="text-sm font-bold text-gray-900 break-words leading-tight">{e.title||'(タイトルなし)'}</div>
          </div>
        })
      }
    </div>
    </div>
  </>
};

/* === App === */
const App=()=>{
  const{showAlert,showConfirm,showPrompt}=useAlert()||{};
  const[currentDate,setCurrentDate]=useState(new Date());
  const[viewMode,setViewMode]=useIndexedDBState('viewMode',window.INITIAL_VIEW_MODE||'day');
  const[settings,setSettings]=useState(null);
  const[resourcesMap,setResourcesMap]=useState({});
  const[isLoading,setIsLoading]=useState(true);
  const[isBackgroundUpdating,setIsBackgroundUpdating]=useState(false);
  const[myEmail,setMyEmail]=useState('');
  const[isDatePickerOpen,setIsDatePickerOpen]=useState(false);
  const[isSettingsOpen,setIsSettingsOpen]=useState(false);
  const[isPersonalOpen,setIsPersonalOpen]=useState(false);
  const[settingsFocus,setSettingsFocus]=useState(null);
  const[settingsGroupId,setSettingsGroupId]=useState(null);
  const[selectedEvent,setSelectedEvent]=useState(null);
  const[editingEvent,setEditingEvent]=useState(null);
  const[isCreateModalOpen,setIsCreateModalOpen]=useState(false);
  const[createDefaultStart,setCreateDefaultStart]=useState(null);
  const[createInitialGuest,setCreateInitialGuest]=useState(null);
  const[sidebarWidth,setSidebarWidth]=useIndexedDBState('sidebarWidth3',250);
  const[webAppUrl,setWebAppUrl]=useState('');
  const[contextMenu,setContextMenu]=useState({visible:false,x:0,y:0,groupId:null});
  const[detailsModalResourceId,setDetailsModalResourceId]=useState(null);
  const[isQuickSearchOpen,setIsQuickSearchOpen]=useState(false);
  const[quickSearchInitialUser,setQuickSearchInitialUser]=useState(null);
  const[resourceCals,setResourceCals]=useState([]);
  const[isTeamStatusOpen,setIsTeamStatusOpen]=useIndexedDBState('teamStatusOpen', window.innerWidth >= 768);
  const[isMobileWindow,setIsMobileWindow]=useState(window.innerWidth < 768);
  const[isMobileMenuOpen,setIsMobileMenuOpen]=useState(false);

  useEffect(()=>{
    const handleResize=()=>setIsMobileWindow(window.innerWidth < 768);
    window.addEventListener('resize',handleResize);
    return()=>window.removeEventListener('resize',handleResize);
  },[]);

  useEffect(()=>{
    if(window.INITIAL_VIEW_MODE){
      setViewMode(window.INITIAL_VIEW_MODE);
    }
  },[]);

  const effectiveSidebarWidth = isMobileWindow ? 60 : sidebarWidth;

  const fetchData=useCallback((force=false)=>{
    if(!settings||!settings.groups)return;
    const activeGroup=settings.groups.find(g=>g.id===settings.activeGroupId);
    if(!activeGroup||!activeGroup.members||activeGroup.members.length===0){setIsLoading(false);return}
    
    let s=new Date(currentDate),e=new Date(currentDate);
    if(viewMode==='week'){
      const d=s.getDay();s.setDate(s.getDate()-d);e.setDate(s.getDate()+14); // 表示期間＋7日プリフェッチ
    }else if(viewMode==='month'){
      s.setDate(1);e.setMonth(e.getMonth()+1);e.setDate(7); // 次の月の初週もプリフェッチ
    }else{
      s.setDate(s.getDate()-1);e.setDate(s.getDate()+8); // 表示日の前後1日＋7日先までプリフェッチ
    }
    s.setHours(0,0,0,0);e.setHours(0,0,0,0);
    
    // 現在のメンバーのうち、1件でもキャッシュがあれば loader を出さずに即時表示（サクサク化）
    const hasAnyCache=activeGroup.members.some(m=>resourcesMap[m]);
    if(hasAnyCache&&!force)setIsBackgroundUpdating(true);
    else setIsLoading(true);

    const fetchStartTime=s.getTime(),fetchEndTime=e.getTime();

    google.script.run.withSuccessHandler(data=>{
      const parsed=JSON.parse(data);
      setResourcesMap(prev=>{
        const next={...prev};
        // 参加者の名前をリソースMapとIndexedDBキャッシュから解決するヘルパー
        const resolveName=(email,fallback)=>{
          if(!email)return fallback;
          if(next[email]&&next[email].name&&!next[email].name.includes('@'))return next[email].name;
          return fallback;
        };
        parsed.forEach(newR=>{
          // イベント内の参加者名を解決
          (newR.events||[]).forEach(ev=>{
            (ev.guests||[]).forEach(g=>{
              const resolved=resolveName(g.email,g.name);
              if(resolved&&resolved!==g.email)g.name=resolved;
            });
            (ev.creators||[]).forEach(c=>{
              const resolved=resolveName(c.email,c.name);
              if(resolved&&resolved!==c.email)c.name=resolved;
            });
          });
          // IndexedDBにキャッシュを保存 (イベント以外の基本情報のみ。既存の施設情報などを上書きしないようにマージ)
          idbKV.get(newR.id, 'resources').then(existing => {
            const merged = {
              id: newR.id,
              name: newR.name,
              email: newR.id,
              photoUrl: newR.photoUrl,
              color: newR.color,
              isResource: (existing && existing.isResource !== undefined) ? existing.isResource : ((newR.id||'').includes('resource.calendar.google.com') || (newR.id||'').includes('group.calendar.google.com')),
              type: existing?.type,
              capacity: existing?.capacity,
              description: existing?.description
            };
            idbKV.set(newR.id, merged, 'resources').catch(()=>{});
          }).catch(()=>{});
          if(next[newR.id]){
            const keptEvents=(next[newR.id].events||[]).filter(ev=>{
              const eStart=new Date(ev.start).getTime(),eEnd=new Date(ev.end).getTime();
              return !(eStart<fetchEndTime&&eEnd>fetchStartTime);
            });
            const eventMap=new Map(keptEvents.map(ev=>[ev.id+'_'+ev.start,ev]));
            (newR.events||[]).forEach(ev=>eventMap.set(ev.id+'_'+ev.start,ev));
            next[newR.id]={...next[newR.id],...newR,events:Array.from(eventMap.values())};
          }else{
            next[newR.id]=newR;
          }
        });
        return next;
      });
      setIsLoading(false);setIsBackgroundUpdating(false);
      // IndexedDBに現在のデータを保存（次回起動時の高速化）
      setResourcesMap(latest => { idbKV.set('lastResourcesMap', latest).catch(()=>{}); return latest; });
    }).withFailureHandler(err=>{
      console.error(err);setIsLoading(false);setIsBackgroundUpdating(false);
    }).getCalendarEvents(s.toISOString(),e.toISOString(),activeGroup.members,force);
  },[currentDate,viewMode,settings]); // resourcesMapはprevで参照するため依存から除外できるが、UI的に不要。

  useEffect(()=>{
    google.script.run.withSuccessHandler(em=>setMyEmail(em)).getCurrentUserEmail();
    google.script.run.withSuccessHandler(url=>setWebAppUrl(url)).getWebAppUrl();
    
    // バックグラウンドで施設リソース情報を取得し、IndexedDBにキャッシュ
    google.script.run.withSuccessHandler(d=>{
      try {
        const cals = JSON.parse(d);
        setResourceCals(cals);
        cals.forEach(c => idbKV.set(c.id, c, 'resources'));
      } catch(e) {}
    }).getResourceCalendars();
    
    const urlParams = new URLSearchParams(window.location.search);
    const urlGroup = urlParams.get('group');

    google.script.run.withSuccessHandler(data=>{
      const s=JSON.parse(data);
      idbKV.get('activeGroupId').then(localGid => {
        if(urlGroup && s.groups.find(g=>g.id===urlGroup)) s.activeGroupId=urlGroup;
        else if(window.INITIAL_GROUP_ID&&s.groups.find(g=>g.id===window.INITIAL_GROUP_ID))s.activeGroupId=window.INITIAL_GROUP_ID;
        else if(localGid && s.groups.find(g=>g.id===localGid)) s.activeGroupId=localGid;
        
        setSettings(s);

        const allMembers = new Set();
      s.groups.forEach(g => g.members.forEach(m => {
        if(m.includes('@') && !m.includes('group.calendar.google.com') && !m.includes('resource.calendar.google.com')) {
          allMembers.add(m);
        }
      }));
      const emails = Array.from(allMembers);
      if (emails.length > 0) {
        Promise.all(emails.map(em => idbKV.get(`user_${em}`))).then(cachedUsers => {
          const toFetch = [];
          const loadedProfiles = {};
          
          emails.forEach((em, i) => {
            if (cachedUsers[i]) {
               loadedProfiles[em] = cachedUsers[i];
            } else {
               toFetch.push(em);
            }
          });
          
          if (Object.keys(loadedProfiles).length > 0) {
             setResourcesMap(prev => {
                const next = {...prev};
                Object.keys(loadedProfiles).forEach(em => {
                   next[em] = { ...next[em], id: em, name: loadedProfiles[em].name, email: em, photoUrl: loadedProfiles[em].photoUrl };
                });
                return next;
             });
          }
          
          if (toFetch.length > 0) {
            setIsBackgroundUpdating(true); // 右上のローディングを回す
            google.script.run.withSuccessHandler(profilesStr => {
               try {
                 const profiles = JSON.parse(profilesStr);
                 setResourcesMap(prev => {
                    const next = {...prev};
                    Object.keys(profiles).forEach(em => {
                       const pf = { name: profiles[em].name, photoUrl: profiles[em].photoUrl };
                       idbKV.set(`user_${em}`, pf);
                       next[em] = { ...next[em], id: em, name: pf.name, email: em, photoUrl: pf.photoUrl };
                    });
                    return next;
                 });
               } catch(e){}
               setIsBackgroundUpdating(false);
            }).getUserProfiles(toFetch);
          }
        });
      }
      });  // idbKV.get('activeGroupId').then() の閉じ
    }).loadSettings();
    // IndexedDBから前回のデータを復元（起動高速化）
    idbKV.get('lastResourcesMap').then(cached => {
      if(cached && Object.keys(cached).length > 0) {
        setResourcesMap(cached);
        setIsLoading(false);
      }
    }).catch(()=>{});
    const l=document.getElementById('initial-loader');const r=document.getElementById('root');if(l){l.style.opacity='0';setTimeout(()=>{l.remove();if(r)r.style.opacity='1'},300)}
  },[]);

  // テーマ適用: <html> クラス制御 + localStorage 同期 + system モードの OS 追従
  useEffect(()=>{
    if(!settings)return;
    const t=['light','dark','system'].includes(settings.theme)?settings.theme:'system';
    const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
    const apply=()=>{const d=t==='dark'||(t==='system'&&mq&&mq.matches);document.documentElement.classList.toggle('dark',d);document.documentElement.setAttribute('data-theme',t)};
    apply();
    try{localStorage.setItem('gc:theme',t)}catch(e){}
    if(t==='system'&&mq){const h=()=>apply();mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h);return()=>{mq.removeEventListener?mq.removeEventListener('change',h):mq.removeListener(h)}}
  },[settings?.theme]);

  useEffect(()=>{if(settings)fetchData(false)},[currentDate,viewMode,settings]); // forceFetch無しならキャッシュを使って即時描画

  // コンテキストメニューを閉じる処理
  const closeContextMenu=()=>setContextMenu({...contextMenu,visible:false});
  useEffect(()=>{
    const handleGlobalClick=()=>closeContextMenu();
    window.addEventListener('click',handleGlobalClick);
    return ()=>window.removeEventListener('click',handleGlobalClick);
  },[contextMenu]);

  // グループのリンクをコピーする
  const handleCopyLink=(groupId)=>{
    const fullUrl=`${webAppUrl}?group=${groupId}&view=${viewMode}`;
    navigator.clipboard.writeText(fullUrl).then(()=>{
      if(showAlert) showAlert('グループへのリンクをコピーしました');
    }).catch(err=>{
      console.error('Copy failed', err);
      if(showAlert) showAlert('コピーに失敗しました');
    });
  };

  const handleTabContextMenu=(e,groupId)=>{
    e.preventDefault();
    setContextMenu({visible:true,x:e.clientX,y:e.clientY,groupId});
  };

  // キーボードナビゲーション
  useEffect(()=>{
    const handleKeyDown=e=>{
      if(isDatePickerOpen||isSettingsOpen||selectedEvent||isCreateModalOpen||editingEvent)return;
      if(e.key==='ArrowLeft'){
        setCurrentDate(d=>{const nd=new Date(d);if(viewMode==='week')nd.setDate(nd.getDate()-7);else if(viewMode==='month')nd.setMonth(nd.getMonth()-1);else nd.setDate(nd.getDate()-1);return nd})
      }else if(e.key==='ArrowRight'){
        setCurrentDate(d=>{const nd=new Date(d);if(viewMode==='week')nd.setDate(nd.getDate()+7);else if(viewMode==='month')nd.setMonth(nd.getMonth()+1);else nd.setDate(nd.getDate()+1);return nd})
      }
    };
    window.addEventListener('keydown',handleKeyDown);
    return ()=>window.removeEventListener('keydown',handleKeyDown);
  },[viewMode,isDatePickerOpen,isSettingsOpen,selectedEvent,isCreateModalOpen,editingEvent]);

  if(!settings)return null;
  const headerPadding = settings.headerPadding || 0;

  return <div className="flex flex-col h-full bg-white relative" style={{paddingTop: headerPadding}}>
    {/* コンテキストメニュー */}
    {contextMenu.visible && <div className="fixed bg-white border shadow-lg rounded z-[9999] py-1 min-w-[180px]" style={{top:contextMenu.y,left:contextMenu.x}} onClick={e=>e.stopPropagation()}>
      <div className="px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center gap-2" onClick={()=>{closeContextMenu();setSettingsFocus(null);setSettingsGroupId(contextMenu.groupId);setIsSettingsOpen(true)}}><Icon name="edit-2" size={14}/> グループを編集</div>
      <div className="px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center gap-2" onClick={()=>{closeContextMenu();handleCopyLink(contextMenu.groupId)}}><Icon name="link" size={14}/> リンクをコピー</div>
      <div className="px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center gap-2" onClick={()=>{
        closeContextMenu();
        const srcGroup = settings.groups.find(g=>g.id===contextMenu.groupId);
        if(srcGroup){
          const dup = {...JSON.parse(JSON.stringify(srcGroup)), id:'grp_'+Date.now(), name:srcGroup.name+' (コピー)'};
          const ns = {...settings, groups:[...settings.groups, dup]};
          setSettings(ns);
          google.script.run.saveSettings(ns);
        }
      }}><Icon name="copy" size={14}/> グループを複製</div>
      <div className="border-t my-1"></div>
      <div className="px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center gap-2" onClick={()=>{
        closeContextMenu();
        const ns = {...settings, groups: settings.groups.map(g=>g.id===contextMenu.groupId ? {...g, meetingView:!g.meetingView} : g)};
        setSettings(ns);
        google.script.run.saveSettings(ns);
      }}><Icon name="users" size={14}/> {settings.groups.find(g=>g.id===contextMenu.groupId)?.meetingView ? '通常表示に切替' : 'ミーティングビューに切替'}</div>
      {viewMode==='day'&&<div className="px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer flex items-center gap-2" onClick={()=>{
        closeContextMenu();
        const ns = {...settings, groups: settings.groups.map(g=>g.id===contextMenu.groupId ? {...g, isCompactDayView:!g.isCompactDayView} : g)};
        setSettings(ns);
        google.script.run.saveSettings(ns);
      }}><Icon name="layout" size={14}/> {settings.groups.find(g=>g.id===contextMenu.groupId)?.isCompactDayView ? '日表示：通常表示に切替' : '日表示：高密度表示に切替'}</div>}
    </div>}

    {/* ヘッダー */}
    <header className="flex flex-col border-b bg-white shadow-sm z-[100] sticky top-0">
      <div className="flex items-center justify-between p-2 pb-2 md:p-4 md:pb-2">
        <div className="flex items-center gap-1 md:gap-4">
          <h1 className="text-xl font-bold text-gray-700 items-center gap-2 hidden md:flex tracking-wider">Group Calendar</h1>
          <div className="flex items-center bg-gray-100 rounded-lg p-0.5 md:p-1">
            <button onClick={()=>setViewMode('month')} className={`px-2 md:px-3 py-1 text-xs md:text-sm rounded-md transition-all ${viewMode==='month'?'bg-white shadow text-blue-600 font-medium':'text-gray-500 hover:text-gray-700'}`}>月</button>
            <button onClick={()=>setViewMode('week')} className={`px-2 md:px-3 py-1 text-xs md:text-sm rounded-md transition-all ${viewMode==='week'?'bg-white shadow text-blue-600 font-medium':'text-gray-500 hover:text-gray-700'}`}>週</button>
            <button onClick={()=>setViewMode('day')} className={`px-2 md:px-3 py-1 text-xs md:text-sm rounded-md transition-all ${viewMode==='day'?'bg-white shadow text-blue-600 font-medium':'text-gray-500 hover:text-gray-700'}`}>日</button>
          </div>
          <div className="hidden md:block"><DigitalClock/></div>
          <button onClick={!isBackgroundUpdating?()=>fetchData(true):undefined} className={`hidden md:flex p-2 rounded-full transition-colors items-center justify-center w-10 h-10 ${isBackgroundUpdating?'text-blue-600 bg-blue-50 cursor-default':'text-gray-500 hover:bg-blue-50 hover:text-blue-600 cursor-pointer'}`}>
            <div className={`flex items-center justify-center w-full h-full ${isBackgroundUpdating?'animate-spin origin-center':''}`}><Icon name="refresh-cw"/></div>
          </button>
          <button onClick={()=>setIsQuickSearchOpen(true)} className="p-1.5 md:p-2 rounded-full text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center justify-center w-8 h-8 md:w-10 md:h-10" title="検索">
            <Icon name="search" size={18}/>
          </button>
        </div>
        <div className="flex items-center gap-1 md:gap-4">
          <div className="relative group cursor-pointer text-center" onClick={()=>setIsDatePickerOpen(true)}>
            <span className="text-lg font-semibold w-auto md:w-48 block text-gray-700 group-hover:text-blue-600 transition-colors hidden md:block">{currentDate.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}</span>
            <span className="text-sm font-semibold block text-gray-700 group-hover:text-blue-600 transition-colors md:hidden">{currentDate.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}).replace(/[()（）]/g,'')}</span>
          </div>
          <div className="flex items-center space-x-1 md:space-x-2 border-r pr-1 mr-1 md:pr-4 md:mr-2">
            <button onClick={()=>setCurrentDate(d=>{const nd=new Date(d);if(viewMode==='week')nd.setDate(nd.getDate()-7);else if(viewMode==='month')nd.setMonth(nd.getMonth()-1);else nd.setDate(nd.getDate()-1);return nd})} className="p-1 md:p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-left" size={18}/></button>
            <button onClick={()=>setCurrentDate(new Date())} className="px-2 md:px-3 py-1 text-xs md:text-sm border rounded hover:bg-gray-50 whitespace-nowrap">今日</button>
            <button onClick={()=>setCurrentDate(d=>{const nd=new Date(d);if(viewMode==='week')nd.setDate(nd.getDate()+7);else if(viewMode==='month')nd.setMonth(nd.getMonth()+1);else nd.setDate(nd.getDate()+1);return nd})} className="p-1 md:p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-right" size={18}/></button>
          </div>
          <button onClick={()=>setIsPersonalOpen(!isPersonalOpen)} className={`hidden md:flex p-2 rounded-full flex-shrink-0 transition-colors mr-1 ${isPersonalOpen?'bg-blue-100 text-blue-600':'text-gray-500 hover:bg-gray-100'}`} title="マイ予定"><Icon name="user"/></button>
          {(()=>{const cur=settings?.theme||'system';const isSys=cur==='system';const isDark=cur==='dark'||(isSys&&(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));return <button onClick={()=>{if(!settings)return;const next=(cur==='dark'||(isSys&&isDark))?'light':'dark';const ns={...settings,theme:next};setSettings(ns);google.script.run.saveSettings(ns)}} className="hidden md:flex relative p-2 text-gray-500 hover:bg-gray-100 rounded-full flex-shrink-0" title={`テーマ: ${cur==='light'?'ライト':cur==='dark'?'ダーク':'システム'} (クリックで切替)`}><Icon name={isDark?'sun':'moon'} size={20}/>{isSys&&<span className="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-blue-500 border border-white dark:border-slate-800" title="システムモード"></span>}</button>})()}
          <button onClick={()=>{setSettingsFocus(null);setIsSettingsOpen(true)}} className="hidden md:flex p-2 text-gray-500 hover:bg-gray-100 rounded-full flex-shrink-0"><Icon name="settings"/></button>
          
          {/* モバイル用ハンバーガーメニュー */}
          <div className="relative md:hidden">
            <button onClick={()=>setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1.5 text-gray-500 hover:bg-gray-100 rounded-full flex-shrink-0">
              <Icon name="menu" size={20}/>
            </button>
            {isMobileMenuOpen && (
              <React.Fragment>
                <div className="fixed inset-0 z-[9000]" onClick={() => setIsMobileMenuOpen(false)}></div>
                <div className="fixed right-2 top-14 bg-white border shadow-xl rounded-lg z-[9001] py-1 min-w-[160px]">
                  <button className="w-full text-left px-4 py-3 text-sm flex items-center gap-3 text-gray-700 hover:bg-gray-50 border-b" onClick={()=>{setIsMobileMenuOpen(false); fetchData(true);}}>
                    <div className={`${isBackgroundUpdating?'animate-spin origin-center':''}`}><Icon name="refresh-cw" size={16}/></div> 再読み込み
                  </button>
                  <button className="w-full text-left px-4 py-3 text-sm flex items-center gap-3 text-gray-700 hover:bg-gray-50 border-b" onClick={()=>{setIsMobileMenuOpen(false); setIsPersonalOpen(!isPersonalOpen);}}>
                    <Icon name="user" size={16}/> マイ予定
                  </button>
                  <button className="w-full text-left px-4 py-3 text-sm flex items-center gap-3 text-gray-700 hover:bg-gray-50 border-b" onClick={()=>{setIsMobileMenuOpen(false); setIsTeamStatusOpen(!isTeamStatusOpen);}}>
                    <Icon name="users" size={16}/> チームボード
                  </button>
                  <button className="w-full text-left px-4 py-3 text-sm flex items-center gap-3 text-gray-700 hover:bg-gray-50" onClick={()=>{setIsMobileMenuOpen(false); setSettingsFocus(null); setIsSettingsOpen(true);}}>
                    <Icon name="settings" size={16}/> 設定
                  </button>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>
      {settings.groups.length>0&&<div className="flex items-center px-2 md:px-4 gap-1 border-t pt-1">
        <div className="flex overflow-x-auto scrollbar-hide gap-1">
          {settings.groups.map((g,gIdx)=><button key={g.id} draggable
            onDragStart={e=>{e.dataTransfer.setData('text/plain',gIdx.toString());e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='0.5'}}
            onDragEnd={e=>{e.currentTarget.style.opacity='1'}}
            onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move'}}
            onDrop={e=>{e.preventDefault();const from=parseInt(e.dataTransfer.getData('text/plain'));const to=gIdx;if(from===to||isNaN(from))return;const ng=[...settings.groups];const item=ng.splice(from,1)[0];ng.splice(to,0,item);const ns={...settings,groups:ng};setSettings(ns);google.script.run.saveSettings(ns)}}
            onContextMenu={e=>handleTabContextMenu(e,g.id)} onClick={()=>{setSettings({...settings,activeGroupId:g.id}); idbKV.set('activeGroupId',g.id).catch(()=>{});}} onDoubleClick={()=>{setSettingsFocus(null);setSettingsGroupId(g.id);setIsSettingsOpen(true)}} className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap flex items-center gap-2 cursor-grab active:cursor-grabbing ${settings.activeGroupId===g.id?'border-b-blue-600 text-blue-600 bg-blue-50/50':'border-b-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50'}`}>
            {g.meetingView&&<Icon name="users" size={12} className="text-purple-500 flex-shrink-0"/>}
            {g.name}
          </button>)}
        </div>
        <button onClick={()=>{setSettingsFocus('new_group');setIsSettingsOpen(true)}} className="ml-2 px-3 py-1 text-blue-600 hover:bg-blue-50 rounded font-bold">＋</button>
      </div>}
    </header>

    <QuickSearchOverlay 
      isOpen={isQuickSearchOpen} 
      onClose={()=>{setIsQuickSearchOpen(false);setQuickSearchInitialUser(null)}} 
      resourceCals={resourceCals}
      resourcesMap={resourcesMap}
      teamMembers={settings?.teamMembers||[]}
      initialUser={quickSearchInitialUser}
      onEventClick={setSelectedEvent}
      groups={settings?.groups||[]}
      onAddToGroup={(groupId, email)=>{
        const ng=[...(settings?.groups||[])];
        const gIdx = ng.findIndex(g=>g.id===groupId);
        if(gIdx===-1) return;
        const g = {...ng[gIdx]};
        g.members = [...g.members];
        if(!g.members.includes(email)) {
          g.members.push(email);
          ng[gIdx] = g;
          const ns={...settings, groups:ng};
          setSettings(ns);
          google.script.run.saveSettings(ns);
          if(showAlert) showAlert(`「${g.name}」に追加しました`);
        } else {
          if(showAlert) showAlert(`すでに「${g.name}」に追加されています`);
        }
      }}
      onAddToTeamBoard={(email)=>{
        let nm = [...(settings.teamMembers||[])];
        if(nm.includes(email)) nm = nm.filter(e=>e!==email);
        else nm.push(email);
        const ns = {...settings, teamMembers:nm};
        setSettings(ns);
        google.script.run.saveSettings(ns);
      }}
      initialUser={quickSearchInitialUser}
    />

    {/* メインエリア */}
    <div className="flex-1 overflow-hidden flex flex-row">
      <main className="flex-1 overflow-hidden relative flex flex-col min-w-0">
        {settings.groups.map(g=>{
          const isActive=settings.activeGroupId===g.id;
          const sorted=g.members.map(m=>resourcesMap[m]||{id:m,name:m.split('@')[0],email:m,events:[],color:'#e5e7eb',isLoading:true});
          return <div key={g.id} className={`flex-1 flex flex-col overflow-hidden h-full w-full ${isActive?'block':'hidden'}`}>
            <SchedulerGrid viewMode={viewMode} currentDate={currentDate} resources={sorted} onEventClick={setSelectedEvent} onCellClick={(rId,t)=>{setCreateDefaultStart(t);setCreateInitialGuest(rId);setEditingEvent(null);setIsCreateModalOpen(true)}} myEmail={myEmail} isVisible={isActive} isLoading={isLoading&&isActive&&sorted.every(r=>r.isLoading)} sidebarWidth={effectiveSidebarWidth} onSidebarResize={setSidebarWidth} groupId={g.id} settings={settings} onResourceClick={(id)=>{
              const r = resourcesMap[id];
              if(r && !id.startsWith('_SEP_')){
                setQuickSearchInitialUser({email:r.email, name:r.name, photoUrl:r.photoUrl});
                setIsQuickSearchOpen(true);
              }
            }}/>
          </div>
        })}
      </main>
      <PersonalPanel isOpen={isPersonalOpen} onClose={()=>setIsPersonalOpen(false)} myEmail={myEmail} resourcesMap={resourcesMap} onEventClick={setSelectedEvent} currentDate={currentDate}/>
    </div>

    {/* チームステータスバー */}
    <TeamStatusBar teamMembers={settings.teamMembers} isOpen={isTeamStatusOpen} onToggle={()=>setIsTeamStatusOpen(p=>!p)}
      onReorder={(from,to)=>{
        const nm = [...(settings.teamMembers||[])];
        const item = nm.splice(from,1)[0];
        nm.splice(to,0,item);
        const ns = {...settings, teamMembers:nm};
        setSettings(ns);
        google.script.run.saveSettings(ns);
      }}
      onUserClick={(user)=>{
        setQuickSearchInitialUser({email:user.email, name:user.name, photoUrl:user.photoUrl});
        setIsQuickSearchOpen(true);
      }}
    />

    {/* モーダル群 */}
    <DatePickerModal isOpen={isDatePickerOpen} onClose={()=>setIsDatePickerOpen(false)} currentDate={currentDate} onSelectDate={setCurrentDate}/>
    <SettingsModal isOpen={isSettingsOpen} onClose={()=>setIsSettingsOpen(false)} settings={settings} onSaveSettings={s=>{setSettings(s);setResourcesMap({});setIsLoading(true)}} myEmail={myEmail} resources={[]} initialFocus={settingsFocus} initialGroupId={settingsGroupId} webAppUrl="" onOpenDetails={setDetailsModalResourceId}/>
    <EventDetailModal event={selectedEvent} onClose={()=>setSelectedEvent(null)} myEmail={myEmail} onEdit={e=>{setSelectedEvent(null);setEditingEvent(e);setCreateDefaultStart(null);setIsCreateModalOpen(true)}} onDelete={e=>{if(confirm('削除しますか？')){setSelectedEvent(null);setIsBackgroundUpdating(true);google.script.run.withSuccessHandler(()=>fetchData(true)).withFailureHandler(err=>{alert(err);setIsBackgroundUpdating(false)}).deleteEvent(myEmail,e.id)}}}/>
    <CreateEventModal isOpen={isCreateModalOpen} onClose={()=>setIsCreateModalOpen(false)} defaultStart={createDefaultStart} defaultCalendarId={myEmail} initialGuest={createInitialGuest} editingEvent={editingEvent} onSave={()=>fetchData(true)} groupMembers={settings.groups.find(g=>g.id===settings.activeGroupId)?.members.map(m=>({email:m,name:resourcesMap[m]?.name||m.split('@')[0]}))||[]} resources={Object.values(resourcesMap)} isWorkspaceUser={settings.isWorkspaceUser}/>
    <ResourceDetailsModal isOpen={!!detailsModalResourceId} onClose={()=>setDetailsModalResourceId(null)} resourceId={detailsModalResourceId}/>


  </div>
};




const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<AlertProvider><App/></AlertProvider>);
</script>
</body>
</html>
